services:
  langgraph-app:
    build: .
    container_name: langgraph-app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
    network_mode: host
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: langgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: research-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-change-me-neo4j-password} 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  research-frontend:
    build: ./frontend
    container_name: research-frontend
    environment:
      FRONTEND_PASSWORD: ${FRONTEND_PASSWORD:-fortidesignagent}
    ports:
      - "8080:8080"
    depends_on:
      - langgraph-app
    restart: unless-stopped

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:
