services:
  litellm-db:
    image: postgres:16
    container_name: litellm-linux-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm-linux-test:
    image: ghcr.io/berriai/litellm-database:main-latest
    container_name: litellm-linux-test
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    env_file:
      - .env
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4010"]
